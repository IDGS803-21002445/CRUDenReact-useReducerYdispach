<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.:: Tablero de Tareas - Mini Sprint Backlog (Versión CDN) ::.</title>

    <!-- Bootstrap 5 CSS CDN (Proporcionado en clase) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="Anonymous">

    <!-- React 18 & ReactDOM 18 CDN para desarrollo -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel Standalone para transpilar JSX en tiempo real en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Estilos personalizados complementarios -->
    <style>
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
        }
        .avatar-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border: 3px solid #0d6efd;
        }
        .card-task {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-task:hover {
            transform: translateY(-3px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
        }
        .task-done {
            border-left: 5px solid #198754 !important;
            background-color: #f8fff9;
        }
        .task-in-progress {
            border-left: 5px solid #0dcaf0 !important;
            background-color: #f7fcfe;
        }
        .task-pending {
            border-left: 5px solid #ffc107 !important;
        }
    </style>
</head>
<body>
    <!-- Contenedor raíz donde se montará la aplicación React -->
    <div id="root"></div>

    <!-- Bootstrap 5 JS Bundle CDN (Proporcionado en clase) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="Anonymous"></script>

    <!-- Script de React con JSX procesado por Babel -->
    <script type="text/babel" src="src/App.js"></script>
</body>
</html>
